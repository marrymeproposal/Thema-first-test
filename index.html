<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MarryMe Proposal</title>
<meta name="description" content="MarryMe Proposal creëert persoonlijke huwelijksaanzoeken: styling op maat, live muziek en professionele foto en film. Van begin tot eind verzorgd.">
<meta property="og:title" content="MarryMe Proposal">
<meta property="og:description" content="Wij ontwerpen het moment. Jij stelt de vraag.">
<meta property="og:image" content="/f/hero.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Figtree:wght@400;500;600&family=Dancing+Script:wght@500;600&display=swap">
<style>
/* Layout: one dark stage, cream paper bands for reading, gold hairlines. Few elements, lots of air:
   film hero, short sections, photos given room. Six views behind one menu. */
:root {
  --ink: #0d0b09;
  --ink-2: #15110d;
  --cream: #f4ece0;
  --paper: #f6efe4;
  --gold: #c9a45c;
  --gold-soft: #e7d2a0;
  --gold-deep: #7e5f22;
  --muted: #c3b8a6;
  --ink-muted: #4a4035;
  --line: rgba(201,164,92,.28);
  --line-paper: rgba(126,95,34,.26);
  --neon: #fff8ec;
  --wa: #25d366;
  --display: "Playfair Display", "Didot", Georgia, serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --script: "Dancing Script", "Snell Roundhand", "Brush Script MT", cursive;
  --hh: 72px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ink); color: var(--cream); font: 17px/1.7 var(--body); }
[hidden] { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 760px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 em, h2 em { color: var(--gold); font-style: italic; }
p, figure, blockquote { margin: 0; }
img, video { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.eyebrow { font-size: .76rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.ico { width: 18px; height: 18px; flex: none; }
html.lock { overflow: hidden; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.rv.in { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }

/* Header */
header { position: fixed; inset: 0 0 auto; z-index: 30; padding-top: env(safe-area-inset-top, 0px); transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
header.solid { background: rgba(13,11,9,.97); border-bottom-color: var(--line); }
.bar { display: flex; align-items: center; gap: 20px; height: 72px; }
.logo { background: none; border: 0; padding: 0; flex: none; }
.logo img { height: 34px; width: auto; }
.mainnav { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.mainnav button { background: none; border: 0; color: #e6dccb; padding: 10px 12px; font-size: .78rem; letter-spacing: .13em; text-transform: uppercase; font-weight: 500; position: relative; }
.mainnav button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 1px; background: var(--gold); transform: scaleX(0); transition: transform .3s; transform-origin: left; }
.mainnav button:hover::after, .mainnav [aria-current="page"]::after { transform: scaleX(1); }
.mainnav [aria-current="page"] { color: var(--gold-soft); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; background: rgba(13,11,9,.4); }
.lang button { background: none; border: 0; color: #d6cbb8; padding: 6px 10px; font-size: .74rem; font-weight: 600; letter-spacing: .08em; }
.lang button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 999px; width: 42px; height: 42px; place-items: center; flex: none; }
.menu-btn span, .menu-btn span::before, .menu-btn span::after { display: block; width: 16px; height: 1.5px; background: var(--cream); position: relative; }
.menu-btn span::before, .menu-btn span::after { content: ""; position: absolute; left: 0; }
.menu-btn span::before { top: -5px; } .menu-btn span::after { top: 5px; }
@media (max-width: 1080px) { .mainnav { display: none; } .menu-btn { display: grid; } .lang { margin-left: auto; } }
@media (max-width: 420px) { .logo img { height: 26px; } .bar { gap: 10px; } .lang button { padding: 6px 8px; } }
.mnav { position: fixed; inset: 0; z-index: 40; background: var(--ink); display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.mnav .bar { justify-content: space-between; }
.mnav-close { background: none; border: 1px solid var(--line); border-radius: 999px; width: 42px; height: 42px; font-size: 1.1rem; color: var(--gold-soft); }
.mnav-list { overflow-y: auto; padding-block: 12px 24px; display: grid; align-content: start; }
.mnav-list button { background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; padding: 16px 0; font-family: var(--display); font-size: 1.7rem; color: var(--cream); }
.mnav-foot { padding-block: 18px; border-top: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; }
main { padding-top: var(--hh); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 30px; border-radius: 999px; font-weight: 600; font-size: .92rem; letter-spacing: .04em; border: 1px solid var(--gold); transition: background .2s, color .2s; text-decoration: none; }
.btn-gold { background: var(--gold); color: var(--ink); }
.btn-gold:hover { background: var(--gold-soft); }
.btn-line { background: rgba(13,11,9,.35); color: var(--gold-soft); }
.btn-line:hover { background: rgba(201,164,92,.16); }
.paper .btn-line { background: transparent; color: var(--gold-deep); border-color: var(--gold-deep); }
.paper .btn-line:hover { background: rgba(126,95,34,.08); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* Hero */
.hero { position: relative; overflow: hidden; margin-top: calc(-1 * var(--hh)); min-height: min(860px, 92vh); display: grid; background: var(--ink); isolation: isolate; }
.hero video, .hero .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.hero .shade { position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(13,11,9,.28), rgba(13,11,9,.72) 100%), linear-gradient(180deg, rgba(13,11,9,.7) 0%, rgba(13,11,9,.1) 25%, rgba(13,11,9,.25) 60%, rgba(13,11,9,.92) 100%); }
.hero-in { align-self: center; text-align: center; display: grid; justify-items: center; gap: 22px; padding-block: calc(var(--hh) + 40px) 90px; }
.neon { display: grid; width: 100%; font-family: var(--script); font-weight: 600; font-size: clamp(2.6rem, 7vw, 6rem); line-height: 1.15; color: var(--neon); }
.neon span { grid-area: 1 / 1; align-self: center; text-wrap: balance; opacity: 0; transition: opacity .9s ease; text-shadow: 0 0 4px rgba(255,255,255,.85), 0 0 16px rgba(255,236,206,.7), 0 0 38px rgba(201,164,92,.55); }
.neon span.on { opacity: 1; }
@media (max-width: 640px) { .neon { font-size: clamp(2.4rem, 11vw, 3.2rem); } }
.hero h1 { font-size: clamp(1.45rem, 2.8vw, 2.1rem); max-width: 30ch; }
.hero .actions { justify-content: center; margin-top: 6px; }
.vbtn { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 24px; background: rgba(13,11,9,.5); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-soft); }
.hero-play { position: absolute; z-index: 2; left: 50%; bottom: 22px; transform: translateX(-50%); width: 58px; height: 58px; border-radius: 50%; border: 1px solid rgba(231,210,160,.75); background: rgba(13,11,9,.55); display: grid; place-items: center; }
.hero-play span { border-left: 17px solid var(--gold-soft); border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 5px; }

/* Sections */
.section { padding-block: clamp(84px, 11vw, 150px); }
.paper { background: var(--paper); color: var(--ink); }
.paper .eyebrow { color: var(--gold-deep); }
.paper h2 em, .paper h1 em { color: var(--gold-deep); }
.dark2 { background: var(--ink-2); }
.head { display: grid; gap: 16px; max-width: 680px; margin-bottom: 56px; }
.head.center { margin-inline: auto; text-align: center; justify-items: center; }
.head h2 { font-size: clamp(2.1rem, 4.4vw, 3.3rem); }
.head p { color: var(--muted); font-size: 1.08rem; }
.paper .head p { color: var(--ink-muted); }

/* Services (home) */
.svc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line-paper); }
.svc > div { padding: 30px 26px 4px 0; display: grid; gap: 12px; align-content: start; min-width: 0; }
.svc > div + div { padding-left: 26px; border-left: 1px solid var(--line-paper); }
.svc svg { width: 30px; height: 30px; color: var(--gold-deep); }
.svc h3 { font-size: 1.4rem; }
.svc p { color: var(--ink-muted); font-size: .98rem; }
@media (max-width: 900px) { .svc { grid-template-columns: 1fr 1fr; } .svc > div:nth-child(3) { padding-left: 0; border-left: 0; } .svc > div:nth-child(n+3) { border-top: 1px solid var(--line-paper); } }
@media (max-width: 520px) { .svc { grid-template-columns: 1fr; } .svc > div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--line-paper); } }

/* Teaser of proposals (home) */
.teaser { display: grid; grid-template-columns: 1fr 1.6fr; gap: clamp(32px, 6vw, 80px); align-items: center; }
.teaser .txt { display: grid; gap: 22px; }
.teaser h2 { font-size: clamp(2.1rem, 4.2vw, 3.2rem); }
.teaser p { color: var(--muted); font-size: 1.08rem; max-width: 44ch; }
.from { font-family: var(--display); color: var(--gold-soft); font-size: 1.05rem; display: flex; align-items: baseline; gap: 12px; }
.from b { font-weight: 400; font-size: clamp(2.6rem, 5vw, 3.6rem); line-height: 1; font-variant-numeric: lining-nums; }
.paper .from { color: var(--gold-deep); }
.trio { display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; aspect-ratio: 1.15; min-width: 0; }
.trio img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.trio img:first-child { grid-row: span 2; }
.trio.quad { grid-template-columns: 1fr 1fr; aspect-ratio: .9; }
.trio.quad img:first-child { grid-row: auto; }
@media (max-width: 860px) { .teaser { grid-template-columns: 1fr; } }

/* Values */
.values { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(28px, 4vw, 56px); }
.value { display: grid; gap: 14px; align-content: start; padding-top: 26px; border-top: 1px solid var(--line); min-width: 0; }
.value svg { width: 30px; height: 30px; color: var(--gold); }
.value h3 { font-size: 1.5rem; }
.value p { color: var(--muted); }
@media (max-width: 820px) { .values { grid-template-columns: 1fr; gap: 36px; } }

/* Reviews */
.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(28px, 4vw, 56px); }
.quote { display: grid; gap: 18px; align-content: start; padding-top: 26px; border-top: 1px solid var(--line-paper); min-width: 0; }
.quote blockquote { font-family: var(--display); font-size: clamp(1.15rem, 1.7vw, 1.35rem); line-height: 1.5; }
.quote cite { font-style: normal; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; }
.stars { color: var(--gold-deep); letter-spacing: .3em; font-size: .85rem; }
.ig-line { margin-top: 44px; color: var(--ink-muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ig-line a { color: var(--gold-deep); font-weight: 600; text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.ig-line a:hover { text-decoration: underline; }

/* CTA band */
.cta-band { position: relative; overflow: hidden; text-align: center; isolation: isolate; }
.cta-band > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.cta-band::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at center, rgba(13,11,9,.48), rgba(13,11,9,.86)); }
.cta-band .wrap { display: grid; justify-items: center; gap: 24px; padding-block: clamp(110px, 14vw, 180px); }
.cta-band h2 { font-size: clamp(2rem, 4.4vw, 3.2rem); }
.cta-band .actions { justify-content: center; }

/* Moment band */
.moment { position: relative; overflow: hidden; isolation: isolate; aspect-ratio: 21 / 9; min-height: 360px; display: grid; align-items: end; }
.moment video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.moment::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(13,11,9,0) 40%, rgba(13,11,9,.85)); }
.moment-in { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; padding-block: 40px; width: 100%; }
.moment-q { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2.4rem); max-width: 22ch; line-height: 1.2; }
.moment-q em { color: var(--gold); }
@media (max-width: 640px) { .moment { aspect-ratio: 4 / 5; } }

/* Page heads */
.pagehead { position: relative; overflow: hidden; margin-top: calc(-1 * var(--hh)); isolation: isolate; }
.pagehead > img, .pagehead > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.pagehead::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(13,11,9,.82), rgba(13,11,9,.45) 45%, rgba(13,11,9,.95)); }
.pagehead .wrap { padding-block: calc(var(--hh) + clamp(80px, 11vw, 140px)) clamp(60px, 7vw, 96px); display: grid; gap: 18px; }
.pagehead h1 { font-size: clamp(2.5rem, 6vw, 4.6rem); max-width: 16ch; }
.pagehead p { max-width: 56ch; color: #e2d8c7; font-size: 1.12rem; }

/* Story (about) */
.story { display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(32px, 6vw, 88px); align-items: start; }
.story-photo { position: sticky; top: calc(var(--hh) + 30px); border-radius: 3px; overflow: hidden; aspect-ratio: 4 / 5; }
.story-photo img { width: 100%; height: 100%; object-fit: cover; }
.chapter { padding-block: 30px; border-top: 1px solid var(--line-paper); display: grid; gap: 10px; }
.chapter:last-child { border-bottom: 1px solid var(--line-paper); }
.chapter h3 { font-size: 1.6rem; }
.chapter p { color: var(--ink-muted); font-size: 1.05rem; max-width: 58ch; }
@media (max-width: 820px) { .story { grid-template-columns: 1fr; } .story-photo { position: relative; top: 0; aspect-ratio: 16 / 11; } }

/* Team */
.members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.member { display: grid; gap: 12px; text-decoration: none; color: inherit; min-width: 0; }
.member img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 3px; }
.member span { display: grid; gap: 2px; }
.member b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
.member small { color: var(--muted); font-size: .95rem; }
.member em { font-style: normal; color: var(--gold-soft); font-weight: 600; font-size: .9rem; margin-top: 4px; }
.member:hover em { text-decoration: underline; }
@media (max-width: 960px) { .members { grid-template-columns: repeat(3, 1fr); } }
.swipe-hint { display: none; margin-top: -28px; margin-bottom: 18px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-soft); }
@media (max-width: 720px) {
  .members, .quotes { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 14px; padding-bottom: 8px; margin-right: calc(-1 * max(20px, env(safe-area-inset-right, 0px))); padding-right: max(20px, env(safe-area-inset-right, 0px)); scrollbar-width: none; }
  .members::-webkit-scrollbar, .quotes::-webkit-scrollbar { display: none; }
  .members > .member { flex: 0 0 64%; scroll-snap-align: start; }
  .quotes > .quote { flex: 0 0 84%; scroll-snap-align: start; }
  .swipe-hint { display: block; }
  .paper .swipe-hint { color: var(--gold-deep); }
}

/* Proposals page */
.intro-block { display: grid; grid-template-columns: 1.2fr 1fr; gap: clamp(32px, 6vw, 88px); align-items: end; }
.intro-block p { color: var(--ink-muted); font-size: 1.1rem; max-width: 52ch; }
.intro-block p + p { margin-top: 16px; }
.price-card { border: 1px solid var(--line-paper); border-radius: 4px; padding: 34px 32px; display: grid; gap: 16px; background: #fbf6ee; }
.price-card small { font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; }
.price-card .from b { font-size: clamp(3rem, 6vw, 4.2rem); }
.price-card p { font-size: .98rem; }
@media (max-width: 820px) { .intro-block { grid-template-columns: 1fr; } }
.insp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin: 72px 0 22px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.insp-h:first-child { margin-top: 0; }
.insp-h h3 { font-size: clamp(1.6rem, 2.8vw, 2.1rem); }
.insp-h { display: grid; gap: 8px; justify-content: stretch; }
.insp-h span { color: var(--muted); font-size: 1rem; max-width: 70ch; }
.feat { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.feat button, .row3 button { position: relative; padding: 0; border: 0; background: var(--ink-2); border-radius: 3px; overflow: hidden; min-width: 0; }
.feat img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform .9s ease; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.row3 img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform .9s ease; }
.feat button:hover img, .row3 button:hover img { transform: scale(1.03); }
.tag { position: absolute; left: 14px; bottom: 14px; background: rgba(13,11,9,.72); color: var(--gold-soft); border-radius: 999px; padding: 6px 13px; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
@media (max-width: 640px) { .feat { grid-template-columns: 1fr; } .row3 { grid-template-columns: 1fr 1fr; gap: 10px; } .row3 button:last-child:nth-child(odd) { grid-column: span 2; } .row3 button:last-child:nth-child(odd) img { aspect-ratio: 16 / 10; } }
.ask { margin-top: 56px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding: 28px 32px; border: 1px solid var(--line); border-radius: 4px; }
.ask p { font-family: var(--display); font-size: 1.3rem; max-width: 46ch; }
.ask p b { display: block; font-weight: 400; font-size: 1.7rem; color: var(--gold-soft); margin-bottom: 4px; }

.upgrade { display: grid; grid-template-columns: 1fr 1.5fr; gap: 56px; }
.up-pics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 64px; }
@media (max-width: 640px) { .up-pics { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 40px; } }
.up-pics img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; }
.upgrade .lead h2 { font-size: clamp(2rem, 3.6vw, 2.8rem); margin-top: 14px; }
.upgrade .lead p { color: var(--ink-muted); margin-top: 14px; max-width: 40ch; }
.upgrade table { width: 100%; border-collapse: collapse; }
.upgrade td { padding: 17px 0; border-bottom: 1px solid var(--line-paper); vertical-align: baseline; font-size: 1.05rem; }
.upgrade td:last-child { text-align: right; color: var(--gold-deep); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 16px; }
.upgrade h3 { font-family: var(--body); font-size: .76rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-deep); font-weight: 600; margin: 44px 0 4px; }
.note { color: var(--ink-muted); font-size: .9rem; margin-top: 12px; }
@media (max-width: 760px) { .upgrade { grid-template-columns: 1fr; gap: 24px; } }

/* Gallery */
.tabs { position: sticky; top: calc(var(--hh) + env(safe-area-inset-top, 0px)); z-index: 5; background: rgba(13,11,9,.97); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tabs button { flex: none; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; font-size: .9rem; color: #e2d8c7; }
.tabs button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.loc-film { position: relative; aspect-ratio: 21 / 9; border-radius: 3px; overflow: hidden; background: var(--ink-2); margin-bottom: 16px; }
.loc-film video, .loc-film img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 640px) { .loc-film { aspect-ratio: 16 / 10; } }
.cols { columns: 3 300px; column-gap: 16px; }

let lang = "nl", view = "home", loc = "kas", paused = false;
try { const s = localStorage.getItem("mmp-lang"); if (T[s]) lang = s; } catch (e) {}
const $ = id => document.getElementById(id);
const t = k => T[lang][k] ?? k;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function renderTeam() {
  $("members").innerHTML = TEAM.map(([k, n, r, ig]) => `<a class="member" href="https://www.instagram.com/${ig}/" target="_blank" rel="noopener"><img src="team/${k}.jpg" alt="${n}" loading="lazy"><span><b>${n}</b><small>${t(r)}</small><em>@${ig}</em></span></a>`).join("");
}
function renderUp() {
  $("up-list").innerHTML = UP.map(([n, p]) => `<tr><td>${n[lang]}</td><td>${p.startsWith("from:") ? t("from") + " " + p.slice(5) : p}</td></tr>`).join("");
}
function renderTabs() {
  $("tabs").innerHTML = LOCS.map(l => `<button data-loc="${l.id}" aria-pressed="${l.id === loc}">${t("loc." + l.id)}</button>`).join("");
}
function renderLoc() {
  const L = LOCS.find(l => l.id === loc);
  const lf = $("loc-film");
  lf.hidden = !L.film;
  if (L.film) lf.innerHTML = `<video src="g/${L.film}.mp4" poster="g/${L.film}.jpg" muted loop playsinline autoplay preload="metadata" aria-hidden="true"></video>`;
  else lf.innerHTML = "";
  $("cols").innerHTML = L.photos.map((p, i) => `<button data-lb="loc:${i}"><img src="p/${p}.jpg" alt="" loading="lazy"></button>`).join("");
  document.querySelectorAll("#tabs [data-loc]").forEach(b => b.setAttribute("aria-pressed", b.dataset.loc === loc));
  const gh = $("gal-head"); gh.poster = `g/${L.film || "kas"}.jpg`;
}
function renderFaq() {
  $("faq-page").innerHTML = FAQ[lang].map(g => `<div class="faq-group"><h3>${g.g}</h3>${g.q.map(([q, a]) => `<details><summary>${q}</summary><p class="ans">${a}</p></details>`).join("")}</div>`).join("");
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("mmp-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = T[l][el.dataset.i18n]; if (v) el.textContent = v; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { const v = T[l][el.dataset.i18nHtml]; if (v) el.innerHTML = v; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T[l][el.dataset.i18nPh]);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  $("lb-close").setAttribute("aria-label", t("close")); $("mnav-close").setAttribute("aria-label", t("close"));
  renderTeam(); renderUp(); renderTabs(); renderFaq(); syncVbtn();
  $("ok").hidden = true;
}

const VIEWS = ["home", "over", "aanzoeken", "galerij", "faq", "contact"];
function go(v) {
  if (!VIEWS.includes(v)) v = "home";
  view = v;
  document.querySelectorAll("[data-view]").forEach(s => s.hidden = s.dataset.view !== v);
  document.querySelectorAll(".mainnav [data-go]").forEach(b => { if (b.dataset.go === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("mnav").hidden = true; $("wa-float").hidden = false;
  const hv = $("hv");
  if (v === "home" && !paused) { const pr = hv.play(); if (pr) pr.catch(() => {}); } else hv.pause();
  const mv = $("mv"); if (v === "home" && !reduce) { const q = mv.play(); if (q) q.catch(() => {}); } else mv.pause();
  if (v === "galerij") renderLoc(); else $("loc-film").innerHTML = "";
  window.scrollTo({ top: 0, behavior: "instant" });
  onScroll(); armReveal();
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
}

let lbList = [], cur = 0;
function openLb(list, i) { lbList = list; cur = (i + list.length) % list.length; $("lb-img").src = `p/${lbList[cur]}.jpg`; $("lb").hidden = false; document.documentElement.classList.add("lock"); $("lb-close").focus({ preventScroll: true }); }
function closeLb() { $("lb").hidden = true; document.documentElement.classList.remove("lock"); }
$("lb-close").onclick = closeLb;
$("lb-prev").onclick = () => openLb(lbList, cur - 1);
$("lb-next").onclick = () => openLb(lbList, cur + 1);
$("lb").addEventListener("click", e => { if (e.target === $("lb")) closeLb(); });
addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("lb").hidden) closeLb(); else { $("mnav").hidden = true; $("wa-float").hidden = false; } }
  if ($("lb").hidden) return;
  if (e.key === "ArrowLeft") openLb(lbList, cur - 1);
  if (e.key === "ArrowRight") openLb(lbList, cur + 1);
});

document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lb]");
  if (lb) { const [k, i] = lb.dataset.lb.split(":"); openLb(k === "pk" ? PK : LOCS.find(l => l.id === loc).photos, +i); return; }
  const tb = e.target.closest("[data-loc]");
  if (tb) { loc = tb.dataset.loc; renderLoc(); const top = document.querySelector(".tabs").getBoundingClientRect().top + scrollY - $("bar").offsetHeight; if (scrollY > top) scrollTo({ top, behavior: "instant" }); return; }
  const g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  const l = e.target.closest("[data-lang]");
  if (l) setLang(l.dataset.lang);
});
$("menu-btn").addEventListener("click", () => { $("mnav").hidden = false; $("wa-float").hidden = true; });
$("mnav-close").addEventListener("click", () => { $("mnav").hidden = true; $("wa-float").hidden = false; });

let ticking = false;
function onScroll() { $("hdr").classList.toggle("solid", view !== "home" || scrollY > 40); }
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { onScroll(); ticking = false; }); } }, { passive: true });
function setHH() { document.documentElement.style.setProperty("--hh", $("bar").offsetHeight + "px"); }
addEventListener("resize", setHH);

/* Hero film + neon line */
function syncVbtn() { const hv = $("hv"); $("vbtn").textContent = hv.paused ? "▶  " + t("hero.play") : "❚❚  " + t("hero.pause"); $("hero-play").hidden = !hv.paused || paused; }
$("hv").addEventListener("playing", syncVbtn); $("hv").addEventListener("pause", syncVbtn);
function tryPlay() { const hv = $("hv"); hv.muted = true; const pr = hv.play(); if (pr) pr.then(syncVbtn).catch(syncVbtn); }
$("vbtn").addEventListener("click", () => { const hv = $("hv"); if (hv.paused) { paused = false; tryPlay(); } else { paused = true; hv.pause(); } syncVbtn(); });
$("hero-play").addEventListener("click", () => { paused = false; tryPlay(); });
if (reduce) { paused = true; $("hv").removeAttribute("autoplay"); }
setTimeout(syncVbtn, 1500);
$("neon").innerHTML = NEON.map((s, i) => `<span${i === 0 ? ' class="on"' : ""} aria-hidden="true">${s}</span>`).join("");
let ni = 0;
setInterval(() => {
  if (reduce || view !== "home" || document.hidden) return;
  const sp = $("neon").children; sp[ni].classList.remove("on"); ni = (ni + 1) % NEON.length; sp[ni].classList.add("on");
}, 3600);

/* Contact form (Netlify Forms) */
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("f-name").value.trim(), mail = $("f-mail").value.trim(), subj = $("f-subj").value.trim(), msg = $("f-msg").value.trim(), ok = $("ok");
  ok.hidden = false;
  if (!name || !subj || !msg || !/^\S+@\S+\.\S+$/.test(mail)) { ok.textContent = t("f.err"); return; }
  const btn = e.target.querySelector('[type="submit"]'); btn.disabled = true;
  fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(new FormData(e.target)).toString() })
    .then(r => { if (!r.ok) throw 0; ok.textContent = t("f.ok").replace("{n}", name); e.target.reset(); })
    .catch(() => { ok.textContent = t("f.fail"); })
    .finally(() => { btn.disabled = false; });
});

/* Reveal on scroll (content is visible at rest) */
const io = "IntersectionObserver" in window && !reduce ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px 15% 0px" }) : null;
function armReveal() { if (!io) return; requestAnimationFrame(() => document.querySelectorAll(`[data-view="${view}"] .rv:not(.in)`).forEach(el => { if (el.getBoundingClientRect().top > innerHeight) io.observe(el); })); }

setHH();
setLang(lang);
const start = (location.hash || "#home").slice(1);
go(VIEWS.includes(start) ? start : "home");
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== view) go(h); });
</script>
</body>
</html>
